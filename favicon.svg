<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- Waveform Primary Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Chassis -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Internal Grid Line -->
  <line x1="8" y1="24" x2="40" y2="24" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- OverMix Waveform Bars (Pro Audio Frequency Matrix) -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="10" y="20" width="3.5" height="8" rx="1.75" fill="url(#waveGrad)"/>
    <!-- Bar 2 -->
    <rect x="15.5" y="14" width="3.5" height="20" rx="1.75" fill="url(#waveGrad)"/>
    <!-- Bar 3 (Center Peak) -->
    <rect x="21" y="9" width="3.5" height="30" rx="1.75" fill="#38bdf8"/>
    <!-- Bar 4 (Cross Wave) -->
    <rect x="26.5" y="15" width="3.5" height="18" rx="1.75" fill="url(#waveGrad)"/>
    <!-- Bar 5 -->
    <rect x="32" y="18" width="3.5" height="12" rx="1.75" fill="url(#waveGrad)"/>
  </g>

  <!-- Dynamic Fader Dot on Center Bar -->
  <circle cx="22.75" cy="18" r="2.5" fill="#ffffff" stroke="#080b10" stroke-width="1"/>
</svg>
