# ==============================================================================
# StudioMaster Pro - aaPanel Nginx Configuration Snippet
# Paste this into your aaPanel Website > Config / Nginx Conf
# ==============================================================================

# Increase upload file size limit for large WAV/MP3 stems
client_max_body_size 100M;
client_body_buffer_size 128k;

# Enable Gzip Compression for fast JS / CSS loading
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

# MIME Types for Web Audio & ES Modules
location ~* \.(js|mjs)$ {
    types { application/javascript js mjs; }
    expires 7d;
    add_header Cache-Control "public, no-transform";
    add_header Access-Control-Allow-Origin *;
}

location ~* \.(wav|mp3|ogg|flac|webm|m4a)$ {
    types {
        audio/wav wav;
        audio/mpeg mp3;
        audio/ogg ogg;
        audio/webm webm;
    }
    expires 30d;
    add_header Access-Control-Allow-Origin *;
}

# PHP-FPM Handler (aaPanel automatically configures this, ensure timeout is healthy)
location ~ \.php$ {
    fastcgi_pass unix:/tmp/php-cgi-74.sock; # Adjust PHP version if using php 8.0/8.1/8.2
    fastcgi_index index.php;
    include fastcgi.conf;
    fastcgi_read_timeout 300;
}
